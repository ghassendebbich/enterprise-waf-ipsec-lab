# ==============================================================================
# FortiWeb-VM Configuration (WAF Appliance)
# Platform: FortiWeb-KVM 7.4.5
# Operation Mode: Reverse Proxy
# ==============================================================================

config system interface
  edit "port1"
    set type physical
    set ip 10.0.100.1/24
    set allowaccess ping ssh http https
  next
end

config router static
  edit 1
    set gateway 10.0.100.254
    set device port1
  next
  edit 2
    set dst 10.10.60.0/24
    set gateway 10.0.100.254
    set device port1
  next
end

config system vip
  edit "VIP-DVWA"
    set vip 10.0.100.11/32
    set interface port1
    set index 1
  next
end

config server-policy server-pool
  edit "DVWA-Pool"
    config pserver-list
      edit 1
        set ip 10.10.60.20
      next
    end
  next
end

config server-policy policy
  edit "DVWA-Policy"
    set ssl enable
    set vserver DVWA-Vserver
    set service HTTP
    set web-protection-profile DVWA-Protection
    set server-pool DVWA-Pool
    set https-service HTTPS
  next
end
