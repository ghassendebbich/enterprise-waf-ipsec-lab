# ==============================================================================
# FortiGate-2 Configuration (Branch Office Firewall)
# Platform: FortiGate-VM64-KVM / FortiOS v7.0.x
# Notice: IPsec Pre-Shared Key sanitized with placeholder.
# Warning: Legacy IPsec proposals (DES/MD5/SHA1) preserved from original lab.
#          Migrate to AES-256-GCM / SHA-256 in production.
# ==============================================================================

config system global
    set hostname "FortiGate-2"
    set timezone 04
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 172.29.18.61 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.2.0.254 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
    next
    edit "Site2-to-Site1"
        set vdom "root"
        set type tunnel
        set interface "port1"
    next
end

config router static
    edit 1
        set gateway 172.29.18.254
        set device "port1"
    next
    edit 4
        set dst 10.0.100.0 255.255.255.0
        set device "Site2-to-Site1"
    next
    edit 5
        set dst 10.10.60.0 255.255.255.0
        set device "Site2-to-Site1"
    next
end

config firewall address
    edit "SITE2-LAN"
        set subnet 10.2.0.0 255.255.255.0
    next
    edit "VLAN-WAF-remote"
        set subnet 10.0.100.0 255.255.255.0
    next
    edit "FG1-WAN-VIP"
        set subnet 172.29.18.51 255.255.255.255
    next
end

config firewall policy
    edit 6
        set name "Block-Site2-to-FG1-WAN-VIP"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "FG1-WAN-VIP"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 1
        set name "LAN-to-Internet"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "SITE2-LAN"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 4
        set name "vpn_Site2-to-Site1_local_WAF"
        set srcintf "port2"
        set dstintf "Site2-to-Site1"
        set action accept
        set srcaddr "all"
        set dstaddr "VLAN-WAF-remote"
        set schedule "always"
        set service "ALL"
    next
    edit 5
        set name "vpn_Site2-to-Site1_remote_WAF"
        set srcintf "Site2-to-Site1"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end

config vpn ipsec phase1-interface
    edit "Site2-to-Site1"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        # LEGACY WARNING: des-md5 / des-sha1 are legacy proposals. Upgrade to AES256/SHA256 in production.
        set proposal des-md5 des-sha1
        set remote-gw 172.29.18.51
        set psksecret "REPLACE_WITH_YOUR_OWN_PSK"
    next
end

config vpn ipsec phase2-interface
    edit "Site2-to-Site1"
        set phase1name "Site2-to-Site1"
        set proposal des-md5 des-sha1
        set src-subnet 10.2.0.0 255.255.255.0
        set dst-subnet 10.10.60.0 255.255.255.0
    next
    edit "Site2-to-Site1-WAF"
        set phase1name "Site2-to-Site1"
        set proposal des-md5 des-sha1
        set src-subnet 10.2.0.0 255.255.255.0
        set dst-subnet 10.0.100.0 255.255.255.0
    next
end
