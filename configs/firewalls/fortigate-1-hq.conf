# ==============================================================================
# FortiGate-1 Configuration (HQ Edge Firewall)
# Platform: FortiGate-VM64-KVM / FortiOS v7.0.x
# Notice: IPsec Pre-Shared Key sanitized with placeholder.
# Warning: Legacy IPsec proposals (DES/MD5/SHA1) preserved from original lab.
#          Migrate to AES-256-GCM / SHA-256 in production.
# ==============================================================================

config system global
    set alias "FortiGate-VM64-KVM"
    set hostname "FortiGate-1"
    set timezone 04
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 172.29.18.51 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
    next
    edit "port2"
        set vdom "root"
        set type physical
    next
    edit "port3"
        set vdom "root"
        set type physical
    next
    edit "VLAN-WAF"
        set vdom "root"
        set ip 10.0.100.254 255.255.255.0
        set allowaccess ping
        set role lan
        set interface "port2"
        set vlanid 50
    next
    edit "VLAN-BACKEND-SE"
        set vdom "root"
        set ip 10.10.60.254 255.255.255.0
        set allowaccess ping
        set role lan
        set interface "port2"
        set vlanid 60
    next
    edit "VLAN-DEV"
        set vdom "root"
        set ip 10.10.10.254 255.255.255.0
        set allowaccess ping
        set role lan
        set interface "port3"
        set vlanid 10
    next
    edit "VLAN-IT"
        set vdom "root"
        set ip 10.10.20.254 255.255.255.0
        set allowaccess ping https
        set role lan
        set interface "port3"
        set vlanid 20
    next
    edit "VLAN-HR"
        set vdom "root"
        set ip 10.10.30.254 255.255.255.0
        set allowaccess ping
        set role lan
        set interface "port3"
        set vlanid 30
    next
    edit "VLAN-MGMT"
        set vdom "root"
        set ip 10.10.40.254 255.255.255.0
        set allowaccess ping https
        set role lan
        set interface "port3"
        set vlanid 40
    next
    edit "Site1-to-Site2"
        set vdom "root"
        set type tunnel
        set src-check disable
        set interface "port1"
    next
end

config router static
    edit 1
        set gateway 172.29.18.254
        set device "port1"
    next
    edit 2
        set dst 10.2.0.0 255.255.255.0
        set device "Site1-to-Site2"
    next
end

config firewall vip
    edit "VIP-DVWA"
        set extip 172.29.18.51
        set mappedip "10.0.100.11"
        set extintf "port1"
        set portforward enable
        set extport 10443
        set mappedport 80
    next
    edit "VIP-FORTIWEB-MGMT"
        set extip 172.29.18.51
        set mappedip "10.0.100.1"
        set extintf "port1"
        set portforward enable
        set extport 8443
        set mappedport 443
    next
    edit "VIP-MODSEC"
        set extip 172.29.18.51
        set mappedip "10.0.100.30"
        set extintf "port1"
        set portforward enable
        set extport 10444
        set mappedport 80
    next
    edit "VIP-DVWA-BYPASS"
        set extip 172.29.18.51
        set mappedip "10.10.60.20"
        set extintf "port1"
        set portforward enable
        set extport 10445
        set mappedport 80
    next
end

config firewall policy
    edit 1
        set name "Allow-WAN-to-FortiWeb-VIP"
        set srcintf "port1"
        set dstintf "VLAN-WAF"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-DVWA"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "Allow-WAF-to-Backend"
        set srcintf "VLAN-WAF"
        set dstintf "VLAN-BACKEND-SE"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 4
        set name "Allow-WAN-to-FortiWeb-MGMT"
        set srcintf "port1"
        set dstintf "VLAN-WAF"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-FORTIWEB-MGMT"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 10
        set name "Backend-to-WAN-NAT"
        set srcintf "VLAN-BACKEND-SE"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 11
        set name "WAF-to-Internet"
        set srcintf "VLAN-WAF"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat enable
    next
    edit 12
        set name "vpn_Site1-to-Site2_local_0"
        set srcintf "VLAN-BACKEND-SE" "VLAN-WAF"
        set dstintf "Site1-to-Site2"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 13
        set name "vpn_Site1-to-Site2_remote_0"
        set srcintf "Site1-to-Site2"
        set dstintf "VLAN-BACKEND-SE" "VLAN-WAF"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 18
        set name "ModSec-to-Internet"
        set srcintf "port1"
        set dstintf "VLAN-WAF"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-MODSEC"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 19
        set name "Bypass-Demo-to-Internet"
        set srcintf "port1"
        set dstintf "VLAN-BACKEND-SE"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP-DVWA-BYPASS"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config vpn ipsec phase1-interface
    edit "Site1-to-Site2"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        # LEGACY WARNING: des-md5 / des-sha1 are legacy proposals. Upgrade to AES256/SHA256 in production.
        set proposal des-md5 des-sha1
        set npu-offload disable
        set remote-gw 172.29.18.61
        set psksecret "REPLACE_WITH_YOUR_OWN_PSK"
    next
end

config vpn ipsec phase2-interface
    edit "Site1-to-Site2"
        set phase1name "Site1-to-Site2"
        set proposal des-md5 des-sha1
        set src-subnet 10.10.60.0 255.255.255.0
        set dst-subnet 10.2.0.0 255.255.255.0
    next
    edit "Site1-to-Site2-WAF"
        set phase1name "Site1-to-Site2"
        set proposal des-md5 des-sha1
        set src-subnet 10.0.100.0 255.255.255.0
        set dst-subnet 10.2.0.0 255.255.255.0
    next
end
