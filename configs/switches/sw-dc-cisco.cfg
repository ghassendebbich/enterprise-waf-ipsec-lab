! ==============================================================================
! Cisco Switch SW-DC (Datacenter Layer 2 Switch)
! Platform: Cisco IOS / EVE-NG L2 Image
! ==============================================================================
hostname SW-DC
!
no aaa new-model
ip cef
spanning-tree mode pvst
!
vlan 50
 name WAF-Subnet
!
vlan 60
 name Backend-DVWA
!
interface GigabitEthernet0/0
 description Trunk-to-FortiGate1-Port2
 switchport trunk allowed vlan 50,60
 switchport trunk encapsulation dot1q
 switchport mode trunk
 negotiation auto
!
interface GigabitEthernet0/1
 description Access-FortiWeb-Port1 (VLAN 50 WAF)
 switchport access vlan 50
 switchport mode access
 negotiation auto
!
interface GigabitEthernet0/2
 description Access-DVWA-Web-Server (VLAN 60 Backend)
 switchport access vlan 60
 switchport mode access
 negotiation auto
!
interface GigabitEthernet0/3
 description Access-ModSec-WAF (VLAN 50 WAF)
 switchport access vlan 50
 switchport mode access
 negotiation auto
!
end
